; Typechecking for the pipeline. Sits beside pytest.ini rather than in a
; pyproject.toml, because this project has no packaging metadata to put one in.
;
; Run it with:  python -m mypy
;
; The source is checked strictly. The tests are checked loosely: they are full
; of hand-written fixture dicts deliberately shaped wrong, and demanding
; annotations on every test function would be noise rather than safety.

[mypy]
files = src, tests, eval
mypy_path = src
; `.` as a base so tests/ resolves as `tests.test_paths` and the
; per-module section below matches; mypy patterns cannot wildcard a partial
; component, so `test_*` is not a legal section name.
explicit_package_bases = True
namespace_packages = True
python_version = 3.14
plugins = pydantic.mypy

; What strict would give us, named one at a time so a later relaxation is a
; visible edit rather than a dropped flag.
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

; A missing return or a None slipping through is the class of bug this is here
; to catch, so these stay on.
strict_optional = True
no_implicit_optional = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False

; pypdfium2 ships no type information.
[mypy-pypdfium2.*]
ignore_missing_imports = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
